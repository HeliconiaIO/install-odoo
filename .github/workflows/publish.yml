name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# One-time setup on npmjs.com -> install-odoo -> Settings -> Trusted Publisher -> GitHub Actions:
#   organization/user: HeliconiaIO, repository: install-odoo, workflow filename: publish.yml
#
# Release: bump "version" in package.json, commit, then
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, which trusted publishing requires
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --provenance --access public
